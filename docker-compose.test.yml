# Postgres descartável dos testes de integração (`pnpm test:integration`).
# Mesma imagem do dev (pgvector), porta própria para conviver com o banco de
# desenvolvimento, e dados em memória: o banco some ao parar o container.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down
services:
  postgres-test:
    image: "pgvector/pgvector:pg17"
    container_name: nasa-db-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nasa_test
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d nasa_test"]
      interval: 2s
      timeout: 3s
      retries: 30
