name: CI

# Portão de PR: o mesmo build que vai para produção, sem publicar a imagem.
# Cobre `prisma generate`, checagem de tipos, `next build` e o Dockerfile inteiro.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Conferir NEXT_PUBLIC_ENV
        env:
          PUBLIC_ENV: ${{ secrets.NEXT_PUBLIC_ENV }}
          PUBLIC_ENV_FILE: ${{ runner.temp }}/public.env
        run: bash scripts/ci/check-public-env.sh

      # Folga de memória para o `next build` (a checagem de tipos usa ~6 GB).
      - name: Ampliar swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-buildx-action@v3

      # Lê o cache de build que o deploy da main grava no GHCR (dependências já instaladas).
      # Não grava: a camada do build muda a cada commit e exportá-la custava ~4 min por run.
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Referência do cache
        run: echo "CACHE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:buildcache" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          build-args: |
            BUILD_HEAP_MB=12288
          secret-files: |
            public_env=${{ runner.temp }}/public.env
