name: CI

# Portão de PR: o mesmo build que vai para produção, sem publicar a imagem.
# Cobre `prisma generate`, checagem de tipos, `next build` e o Dockerfile inteiro.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            public_env=${{ secrets.NEXT_PUBLIC_ENV }}
