name: CI

# Portão de PR: o mesmo build que vai para produção, sem publicar a imagem.
# Cobre `prisma generate`, checagem de tipos, `next build` e o Dockerfile inteiro.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Conferir NEXT_PUBLIC_ENV
        env:
          PUBLIC_ENV: ${{ secrets.NEXT_PUBLIC_ENV }}
          PUBLIC_ENV_FILE: ${{ runner.temp }}/public.env
        run: bash scripts/ci/check-public-env.sh

      # A checagem de tipos passa de 8 GB de heap; swap extra dá folga ao runner de 16 GB.
      - name: Ampliar swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_HEAP_MB=12288
          secret-files: |
            public_env=${{ runner.temp }}/public.env
