name: Typecheck trace (temporário)

# Diagnóstico da checagem de tipos: memória, tempo e os arquivos mais caros. Remover após a análise.
on:
  push:
    branches: [claude/deploy-build-optimization-ac90aa]
    paths: [".github/workflows/typecheck-trace.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ampliar swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm exec next typegen

      - name: tsc com diagnóstico
        env:
          NODE_OPTIONS: --max-old-space-size=14336
        run: |
          /usr/bin/time -v pnpm exec tsc --noEmit --incremental false --extendedDiagnostics --generateTrace trace 2> time.txt | tee diagnostics.txt || true
          grep -E "Maximum resident|Elapsed" time.txt | tee -a diagnostics.txt

      - name: Arquivos e pastas mais caros
        run: |
          node - <<'JS' | tee hotspots.txt
          const fs = require("fs");
          const events = JSON.parse(fs.readFileSync("trace/trace.json", "utf8"));
          const byFile = new Map();
          for (const event of events) {
            if (event.name !== "checkSourceFile" || event.ph !== "X") continue;
            const path = event.args.path.replace(process.cwd() + "/", "");
            byFile.set(path, (byFile.get(path) ?? 0) + event.dur / 1000);
          }
          const byFolder = new Map();
          for (const [path, ms] of byFile) {
            const folder = path.split("/").slice(0, path.startsWith("src/") ? 3 : 2).join("/");
            byFolder.set(folder, (byFolder.get(folder) ?? 0) + ms);
          }
          const top = (map, count) => [...map].sort((a, b) => b[1] - a[1]).slice(0, count)
            .map(([name, ms]) => `${(ms / 1000).toFixed(1).padStart(7)}s  ${name}`).join("\n");
          console.log("== Top 40 arquivos (tempo de checagem) ==\n" + top(byFile, 40));
          console.log("\n== Top 30 pastas ==\n" + top(byFolder, 30));
          JS
          npx --yes @typescript/analyze-trace trace --forceMillis 1000 --skipMillis 200 > analyze-trace.txt 2>&1 || true
          head -150 analyze-trace.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typecheck-trace
          path: |
            diagnostics.txt
            hotspots.txt
            analyze-trace.txt
            trace/
          retention-days: 7
